<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Guru BK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="bg-slate-100 p-6">

  <!-- NAV ADMIN -->
  <div class="max-w-7xl mx-auto flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 mb-6 no-print">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-600 text-white rounded-lg"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></div>
      <span class="font-bold text-slate-800">Portal Admin BK Sekolah</span>
    </div>
    <div class="flex gap-3 text-xs font-bold">
      <a href="admin-siswa.html" class="px-3 py-2 bg-slate-100 rounded-lg hover:bg-slate-200">Master Data Siswa</a>
      <button onclick="window.print()" class="px-3 py-2 bg-indigo-50 text-indigo-600 rounded-lg border border-indigo-200">Cetak Laporan</button>
      <button onclick="logout()" class="px-3 py-2 bg-rose-50 text-rose-600 rounded-lg">Keluar</button>
    </div>
  </div>

  <!-- STATISTIK KASUS (ANALYTICS) -->
  <div class="max-w-7xl mx-auto grid grid-cols-3 gap-6 mb-6 no-print">
    <div class="bg-white p-6 rounded-2xl border border-slate-200">
      <span class="text-xs font-bold text-slate-400">TOTAL TIKET KONSELING</span>
      <h3 id="statTotal" class="text-3xl font-extrabold text-slate-900 mt-2">0</h3>
    </div>
    <div class="bg-white p-6 rounded-2xl border border-slate-200">
      <span class="text-xs font-bold text-amber-500">BUTUH PENANGANAN (PENDING)</span>
      <h3 id="statPending" class="text-3xl font-extrabold text-amber-600 mt-2">0</h3>
    </div>
    <div class="bg-white p-6 rounded-2xl border border-slate-200">
      <span class="text-xs font-bold text-emerald-500">SELESAI DITANGANI</span>
      <h3 id="statSelesai" class="text-3xl font-extrabold text-emerald-600 mt-2">0</h3>
    </div>
  </div>

  <!-- TABEL MANAJEMEN TIKET -->
  <div class="max-w-7xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
    <h3 class="font-bold text-slate-800 mb-4">Daftar Laporan / Permohonan Konseling Siswa</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="border-b bg-slate-50 text-slate-500">
            <th class="p-3">ID Tiket</th>
            <th class="p-3">Siswa</th>
            <th class="p-3">Kelas</th>
            <th class="p-3">Kategori</th>
            <th class="p-3">Urgensi</th>
            <th class="p-3">Keluhan</th>
            <th class="p-3">Status</th>
            <th class="p-3 no-print">Aksi Respon</th>
          </tr>
        </thead>
        <tbody id="tabelKonseling" class="divide-y">
          <!-- Data di-load via JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    lucide.createIcons();
    if(!sessionStorage.getItem("bk_admin_logged")) window.location.href = "admin-login.html";

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz63gAUXNSk6-aojRqikLB0ldr1o19Flk4TGiO7CMt4BZEFvgX2C9Bo0Nxp4ek-eVcR/exec";

    function loadData() {
      fetch(`${SCRIPT_URL}?action=getAll`)
      .then(res => res.json())
      .then(res => {
        const data = res.data;
        document.getElementById('statTotal').innerText = data.length;
        document.getElementById('statPending').innerText = data.filter(d => d.Status === 'Pending').length;
        document.getElementById('statSelesai').innerText = data.filter(d => d.Status === 'Selesai').length;

        const tbody = document.getElementById('tabelKonseling');
        tbody.innerHTML = '';

        data.forEach(item => {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="p-3 font-bold">${item.ID_Tiket}</td>
              <td class="p-3">${item.Nama} (${item.NISN})</td>
              <td class="p-3">${item.Kelas}</td>
              <td class="p-3">${item.Kategori}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded font-bold ${item.Urgensi === 'Sangat Mendesak' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100'}">${item.Urgensi || 'Biasa'}</span></td>
              <td class="p-3 max-w-xs">${item.Pesan}</td>
              <td class="p-3"><span class="px-2 py-0.5 rounded font-bold ${item.Status === 'Selesai' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${item.Status}</span></td>
              <td class="p-3 no-print">
                <button onclick="responTiket('${item.ID_Tiket}')" class="px-3 py-1 bg-indigo-600 text-white rounded-lg font-bold">Tanggapi</button>
              </td>
            </tr>
          `;
        });
      });
    }

    function responTiket(id) {
      const tanggapan = prompt("Masukkan Tanggapan / Solusi / Jadwal Konsultasi untuk tiket: " + id);
      if(tanggapan) {
        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'respond', id_tiket: id, tanggapan: tanggapan })
        })
        .then(res => res.json())
        .then(data => { alert("Tanggapan berhasil disimpan!"); loadData(); });
      }
    }

    function logout() {
      sessionStorage.removeItem("bk_admin_logged");
      window.location.href = "admin-login.html";
    }

    loadData();
  </script>
</body>
</html>
