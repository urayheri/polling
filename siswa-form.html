<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Konseling BK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 p-6">

  <!-- TOMBOL DARURAT (PANIC BUTTON) -->
  <div class="max-w-2xl mx-auto mb-6 p-4 bg-rose-50 border border-rose-200 rounded-2xl flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-rose-600 text-white rounded-xl"><i data-lucide="phone-call" class="w-5 h-5"></i></div>
      <div>
        <h4 class="font-bold text-rose-900 text-sm">Butuh Bantuan Darurat / Situasi Krisis?</h4>
        <p class="text-xs text-rose-700">Jika mengalami kondisi darurat emosional atau kekerasan, hubungi segera.</p>
      </div>
    </div>
    <a href="tel:112" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl">Call Center 112</a>
  </div>

  <!-- FORM UTAMA -->
  <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Formulir Konseling / Aduan</h2>
        <p class="text-xs text-slate-500">Privasi dan kerahasiaan data Anda terlindungi sepenuhnya.</p>
      </div>
      <a href="index.html" class="text-xs text-indigo-600 font-bold hover:underline">← Kembali</a>
    </div>

    <form id="formBK" class="space-y-4">
      <div class="flex items-center gap-2 mb-2">
        <input type="checkbox" id="isAnonim" onchange="toggleAnonim(this)" class="w-4 h-4 text-indigo-600">
        <label for="isAnonim" class="text-xs font-semibold text-slate-700">Kirim Secara Anonim (Rahasiakan Nama Saya)</label>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">NISN</label>
          <input type="text" id="nisn" required class="w-full px-3 py-2.5 rounded-xl border text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
          <input type="text" id="nama" placeholder="Masukkan nama" class="w-full px-3 py-2.5 rounded-xl border text-sm">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kelas</label>
          <input type="text" id="kelas" required placeholder="Contoh: X RPL 1" class="w-full px-3 py-2.5 rounded-xl border text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Kategori Permasalahan</label>
          <select id="kategori" class="w-full px-3 py-2.5 rounded-xl border text-sm bg-white">
            <option value="Akademik">Akademik / Problem Belajar</option>
            <option value="Pribadi">Masalah Pribadi & Mental Health</option>
            <option value="Sosial-Bullying">Sosial / Perundungan (Bullying)</option>
            <option value="Karir">Karir & Konsultasi Studi Lanjut</option>
            <option value="Kedisiplinan">Kedisiplinan & Tata Tertib</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Prioritas Urgensi</label>
        <select id="urgensi" class="w-full px-3 py-2.5 rounded-xl border text-sm bg-white">
          <option value="Biasa">Biasa (Dapat Direspon 1-2 Hari)</option>
          <option value="Penting">Penting (Membutuhkan Tanggapan Segera)</option>
          <option value="Sangat Mendesak">Sangat Mendesak / Butuh Tatap Muka Langsung</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Ceritakan Hal yang Ingin Dikonsultasikan</label>
        <textarea id="pesan" rows="5" required placeholder="Tuliskan secara lengkap apa yang Anda rasakan atau alami..." class="w-full px-3 py-2.5 rounded-xl border text-sm"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">
        Kirim Permohonan Konseling
      </button>
    </form>
  </div>

  <script>
    lucide.createIcons();
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz63gAUXNSk6-aojRqikLB0ldr1o19Flk4TGiO7CMt4BZEFvgX2C9Bo0Nxp4ek-eVcR/exec";

    function toggleAnonim(checkbox) {
      const nama = document.getElementById('nama');
      if (checkbox.checked) {
        nama.value = "Anonim";
        nama.disabled = true;
      } else {
        nama.value = "";
        nama.disabled = false;
      }
    }

    document.getElementById('formBK').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Mengirim...";

      const payload = {
        action: 'submit',
        nisn: document.getElementById('nisn').value,
        nama: document.getElementById('nama').value || 'Anonim',
        kelas: document.getElementById('kelas').value,
        kategori: document.getElementById('kategori').value,
        urgensi: document.getElementById('urgensi').value,
        pesan: document.getElementById('pesan').value
      };

      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        btn.innerText = "Kirim Permohonan Konseling";
        if(data.result === 'success') {
          alert(`Laporan Berhasil Terkirim!\n\nKODE TIKET ANDA: ${data.id_tiket}\nSimpan kode ini untuk mengecek balasan dari Guru BK.`);
          window.location.href = `siswa-status.html?tiket=${data.id_tiket}`;
        }
      });
    });
  </script>
</body>
</html>
