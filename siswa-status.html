<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cek Status Tiket BK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 p-6">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-slate-200 shadow-xl">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-slate-900">Cek Balasan Konseling</h2>
      <a href="index.html" class="text-xs text-indigo-600 font-bold hover:underline">← Beranda</a>
    </div>

    <div class="flex gap-2 mb-6">
      <input type="text" id="inputTiket" placeholder="Masukkan ID Tiket (Contoh: BK-98231)" class="flex-1 px-4 py-3 rounded-xl border text-sm">
      <button onclick="cekTiket()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl text-sm">Cari</button>
    </div>

    <!-- HASIL STATUS -->
    <div id="resultBox" class="hidden p-6 bg-slate-50 rounded-2xl border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <span class="text-xs font-bold text-slate-500">ID TIKET: <span id="resId" class="text-slate-900"></span></span>
        <span id="resStatus" class="px-3 py-1 rounded-full text-xs font-bold"></span>
      </div>
      <div>
        <p class="text-xs font-bold text-slate-400 mb-1">PESAN ANDA:</p>
        <p id="resPesan" class="text-sm text-slate-700 italic bg-white p-3 rounded-xl border border-slate-100"></p>
      </div>
      <div class="pt-2 border-t">
        <p class="text-xs font-bold text-indigo-600 mb-1">TANGGAPAN / JADWAL KONSULTASI DARI GURU BK:</p>
        <p id="resTanggapan" class="text-sm font-semibold text-slate-900 bg-indigo-50/50 p-4 rounded-xl border border-indigo-100"></p>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw0_xU66UXpJw0n0mVjYKYcnjShzppFC1SPYtlegRTCf6A_lPL4y50FKCTZTGvX4yU7kw/exec";

    // Auto load jika ada parameter dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const tiketParam = urlParams.get('tiket');
    if(tiketParam) {
      document.getElementById('inputTiket').value = tiketParam;
      cekTiket();
    }

    function cekTiket() {
      const tiket = document.getElementById('inputTiket').value;
      if(!tiket) return alert("Masukkan ID Tiket");

      fetch(`${SCRIPT_URL}?action=check&id=${encodeURIComponent(tiket)}`)
      .then(res => res.json())
      .then(data => {
        if(data.found) {
          document.getElementById('resultBox').classList.remove('hidden');
          document.getElementById('resId').innerText = data.data.ID_Tiket;
          document.getElementById('resPesan').innerText = data.data.Pesan;
          document.getElementById('resTanggapan').innerText = data.data.Tanggapan_Guru || 'Belum ada balasan dari Guru BK. Silakan cek berkala.';
          
          const statusElem = document.getElementById('resStatus');
          statusElem.innerText = data.data.Status;
          statusElem.className = data.data.Status === 'Selesai' ? 
            'px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700' : 
            'px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700';
        } else {
          alert('Tiket tidak ditemukan.');
        }
      });
    }
  </script>
</body>
</html>
