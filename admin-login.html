<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin BK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-xl w-full max-w-sm text-center">
    <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <i data-lucide="lock"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-900">Autentikasi Guru BK</h2>
    <p class="text-xs text-slate-500 mb-6">Masukkan PIN keamanan untuk mengakses portal admin.</p>

    <form id="loginForm" class="space-y-4">
      <input type="password" id="pinInput" placeholder="Masukkan PIN Admin" class="w-full text-center tracking-widest px-4 py-3 border rounded-xl font-bold text-lg">
      <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition">Masuk Portal</button>
    </form>
  </div>

  <script>
    lucide.createIcons();
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value;
      if (pin === "123456") { // Ganti PIN sesuai kebutuhan
        sessionStorage.setItem("bk_admin_logged", "true");
        window.location.href = "admin-dashboard.html";
      } else {
        alert("PIN Otentikasi Salah!");
      }
    });
  </script>
</body>
</html>
