<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Kasih Guru BK | Login Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.8s ease;
    }

    /* ANIMASI TALI SAKELAR HATI */
    .lamp-string-container {
      position: absolute;
      top: 0;
      right: 15%;
      z-index: 40;
      cursor: pointer;
      user-select: none;
    }

    .string {
      width: 3px;
      height: 120px;
      background: linear-gradient(to bottom, #cbd5e1, #f43f5e);
      margin: 0 auto;
      transition: height 0.2s ease-in-out;
      border-radius: 2px;
    }

    .heart-pull {
      width: 36px;
      height: 36px;
      background: #f43f5e;
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s;
    }

    .lamp-string-container:active .string {
      height: 150px;
    }

    .lamp-string-container:active .heart-pull {
      transform: scale(1.25) rotate(12deg);
    }

    /* KARTU LAMPU BK (LANTERN / LIGHT BULB SHAPE) */
    .bk-lantern-card {
      position: relative;
      border-radius: 2.5rem;
      transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Cahaya Lampu / Glow Effect */
    .light-on .bk-lantern-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.25), 
                  0 0 100px rgba(251, 191, 36, 0.2), 
                  0 20px 40px rgba(0, 0, 0, 0.08);
      border: 2px solid rgba(254, 205, 211, 0.8);
    }

    .light-off .bk-lantern-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      box-shadow: none;
      border: 2px solid rgba(51, 65, 85, 0.5);
    }

    /* Gantungan Atas Lampu (Cap & Ring) */
    .lantern-top {
      width: 70px;
      height: 14px;
      background: linear-gradient(to right, #fb7185, #f43f5e, #e11d48);
      border-radius: 10px 10px 0 0;
      margin: 0 auto;
      position: relative;
    }

    .lantern-ring {
      width: 24px;
      height: 24px;
      border: 3px solid #f43f5e;
      border-radius: 50%;
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Hiasan Hati Melayang (Floating Hearts Animation) */
    @keyframes floatHeart {
      0% { transform: translateY(0px) scale(1); opacity: 0.8; }
      50% { transform: translateY(-10px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0px) scale(1); opacity: 0.8; }
    }

    .floating-heart {
      animation: floatHeart 3s ease-in-out infinite;
    }
  </style>
</head>
<body id="bgBody" class="light-off bg-slate-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-rose-500 selection:text-white">

  <!-- ANIMASI INTERAKTIF TALI LAMPU HATI -->
  <div class="lamp-string-container group" onclick="toggleLight()" title="Tarik hati untuk menyalakan/mematikan cahaya kasih">
    <div class="string"></div>
    <div class="heart-pull">
      <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
    </div>
    <span class="text-[10px] font-bold text-rose-400 group-hover:text-rose-500 block text-center mt-2 transition">
      Tarik Hati
    </span>
  </div>

  <!-- CONTAINER KARTU LOGIN BERBENTUK LAMPU KASIH -->
  <div id="loginCard" class="opacity-0 scale-90 translate-y-10 pointer-events-none w-full max-w-sm relative z-20">
    
    <!-- Bagian Kepala Lampu / Gantungan -->
    <div class="lantern-top">
      <div class="lantern-ring"></div>
    </div>

    <!-- Badan Lampu / Kartu Form -->
    <div class="bk-lantern-card p-8 text-center">
      
      <!-- Hiasan Hati Bersinar -->
      <div class="w-16 h-16 bg-gradient-to-tr from-rose-500 to-amber-400 text-white rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg shadow-rose-200 floating-heart">
        <i data-lucide="heart-handshake" class="w-8 h-8"></i>
      </div>

      <!-- Judul & Subtitle -->
      <h2 class="text-2xl font-extrabold bg-gradient-to-r from-rose-600 via-pink-600 to-violet-600 bg-clip-text text-transparent">
        Ruang Kasih Guru BK
      </h2>
      <p class="text-xs text-slate-500 mt-1 mb-6 font-medium">
        "Mendengar dengan Hati, Membimbing dengan Kasih Sayang"
      </p>

      <!-- FORM LOGIN PIN -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-rose-700 mb-2 flex items-center justify-center gap-1">
            <i data-lucide="key" class="w-3.5 h-3.5"></i> PIN Keamanan Admin BK
          </label>
          <input 
            type="password" 
            id="pinInput" 
            maxlength="6"
            placeholder="• • • • • •" 
            required 
            class="w-full text-center tracking-widest px-4 py-3.5 border border-rose-200 rounded-2xl font-extrabold text-xl focus:ring-4 focus:ring-rose-100 focus:border-rose-500 focus:outline-none transition text-slate-800 placeholder:text-rose-200 bg-rose-50/30"
          >
        </div>

        <button 
          type="submit" 
          id="btnSubmit" 
          class="w-full py-3.5 bg-gradient-to-r from-rose-500 via-pink-500 to-violet-600 hover:from-rose-600 hover:to-violet-700 text-white font-bold rounded-2xl shadow-lg shadow-rose-200 hover:shadow-rose-300 transition duration-200 active:scale-[0.98] flex items-center justify-center gap-2 text-sm"
        >
          <i data-lucide="sparkles" class="w-4 h-4"></i> Masuk Ruang Pelayanan
        </button>
       <div class="w-full py-3.5 bg-gradient-to-r from-rose-500 via-pink-500 to-violet-600 hover:from-rose-600 hover:to-violet-700 text-white font-bold rounded-2xl shadow-lg shadow-rose-200 hover:shadow-rose-300 transition duration-200 active:scale-[0.98] flex items-center justify-center gap-2 text-sm"
        >
          <i data-lucide="sparkles" class="w-4 h-4"></i> <a href="index.html">Balik Ke Beranda</a>
        </div>
      </form>

      <!-- Pijar Cahaya Bawah (Pemanis Desain Lampu) -->
      <div class="mt-6 pt-4 border-t border-rose-100 flex items-center justify-center gap-1.5 text-[11px] font-semibold text-rose-600">
        <i data-lucide="shield-heart" class="w-4 h-4"></i> Safe & Loving Environment
      </div>
    </div>

  </div>

  <!-- SCRIPT INTERAKTIF CAHAYA -->
  <script>
    lucide.createIcons();

    let isLightOn = false;

    function toggleLight() {
      isLightOn = !isLightOn;
      const body = document.getElementById('bgBody');
      const card = document.getElementById('loginCard');

      if (isLightOn) {
        // Cahaya Menyala (Ruangan menjadi hangat & penuh warna lembut)
        body.className = "light-on bg-gradient-to-br from-rose-100 via-amber-50 to-pink-100 min-h-screen flex items-center justify-center p-4 relative";
        card.classList.remove('opacity-0', 'scale-90', 'translate-y-10', 'pointer-events-none');
        card.classList.add('opacity-100', 'scale-100', 'translate-y-0');
        document.getElementById('pinInput').focus();
      } else {
        // Cahaya Redup
        body.className = "light-off bg-slate-950 min-h-screen flex items-center justify-center p-4 relative";
        card.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        card.classList.add('opacity-0', 'scale-90', 'translate-y-10', 'pointer-events-none');
      }
    }

    // FORM HANDLER
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnSubmit');

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Membuka Ruang...`;
      lucide.createIcons();

      setTimeout(() => {
        if (pin === "123456") { // PIN Default
          sessionStorage.setItem("bk_admin_logged", "true");
          window.location.href = "admin-dashboard.html";
        } else {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4"></i> Masuk Ruang Pelayanan`;
          lucide.createIcons();

          const card = document.getElementById('loginCard');
          card.classList.add('animate-bounce');
          setTimeout(() => card.classList.remove('animate-bounce'), 1000);
          
          alert("PIN Otentikasi Salah! Silakan periksa kembali PIN Anda.");
        }
      }, 400);
    });

    // Otomatis nyalakan lampu kasih saat pertama halaman dimuat
    setTimeout(() => {
      toggleLight();
    }, 400);
  </script>
</body>
</html>
