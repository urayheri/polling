<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin BK | Interactive Light Switch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    /* ANIMASI TALI LAMPU */
    .lamp-container {
      position: absolute;
      top: 0;
      right: 15%;
      z-index: 30;
      cursor: pointer;
      user-select: none;
    }

    .string {
      width: 2px;
      height: 140px;
      background: linear-gradient(to bottom, #64748b, #cbd5e1);
      margin: 0 auto;
      transition: height 0.15s ease-in-out;
    }

    .bulb-handle {
      width: 24px;
      height: 24px;
      background: #f59e0b;
      border-radius: 50%;
      margin: 0 auto;
      box-shadow: 0 0 15px #f59e0b;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s;
    }

    /* Efek saat tali ditarik (Active Pull) */
    .lamp-container:active .string {
      height: 165px;
    }

    .lamp-container:active .bulb-handle {
      transform: scale(1.2);
    }

    /* Efek Cahaya Lampu Saat Menyala */
    .light-on .bulb-handle {
      background: #fbbf24;
      box-shadow: 0 0 35px #fbbf24, 0 0 60px #f59e0b;
    }

    .light-off .bulb-handle {
      background: #475569;
      box-shadow: none;
    }

    /* Efek Transisi Kartu Login */
    .card-transition {
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }
  </style>
</head>
<body id="bgBody" class="light-off bg-slate-950 min-h-screen flex items-center justify-center p-4 overflow-hidden relative selection:bg-indigo-500 selection:text-white">

  <!-- ANIMASI INTERAKTIF TALI LAMPU -->
  <div class="lamp-container group" onclick="toggleLight()" title="Tarik tali untuk menyalakan/mematikan lampu">
    <!-- Tali Lampu -->
    <div class="string"></div>
    <!-- Bola Lampu / Ujung Tali Sakelar -->
    <div class="bulb-handle flex items-center justify-center">
      <i data-lucide="power" class="w-3 h-3 text-white opacity-80"></i>
    </div>
    <!-- Petunjuk Tarik -->
    <span class="text-[10px] font-bold text-slate-400 group-hover:text-amber-400 block text-center mt-2 transition">
      Tarik Tali
    </span>
  </div>

  <!-- CONTAINER KARTU LOGIN -->
  <div id="loginCard" class="card-transition opacity-0 scale-95 translate-y-8 pointer-events-none w-full max-w-sm">
    <div class="bg-white/95 backdrop-blur-xl p-8 rounded-3xl border border-white/20 shadow-2xl text-center relative z-10">
      
      <!-- ICON HEADER -->
      <div id="iconBox" class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner transition duration-300">
        <i data-lucide="lock" class="w-7 h-7"></i>
      </div>

      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Autentikasi Admin</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">Portal Bimbingan & Konseling Sekolah</p>

      <!-- FORM LOGIN PIN -->
      <form id="loginForm" class="space-y-4">
        <div class="relative">
          <input 
            type="password" 
            id="pinInput" 
            maxlength="6"
            placeholder="• • • • • •" 
            required 
            class="w-full text-center tracking-widest px-4 py-3.5 border border-slate-200 rounded-2xl font-extrabold text-xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600 focus:outline-none transition text-slate-800 placeholder:text-slate-300 bg-slate-50/50"
          >
        </div>

        <button 
          type="submit" 
          id="btnSubmit" 
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition duration-200 active:scale-[0.98] flex items-center justify-center gap-2 text-sm"
        >
          <i data-lucide="key-round" class="w-4 h-4"></i> Masuk Dashboard
        </button>
      </form>

      <!-- FOOTER INFO -->
      <p class="text-[11px] text-slate-400 mt-6">
        Gunakan PIN Keamanan Sekolah untuk Akses Admin
      </p>
    </div>
  </div>

  <!-- SCRIPT INTERAKTIF -->
  <script>
    lucide.createIcons();

    let isLightOn = false;

    // FUNGSI TALI LAMPU TARIK & NYALA/MATI
    function toggleLight() {
      isLightOn = !isLightOn;
      const body = document.getElementById('bgBody');
      const card = document.getElementById('loginCard');

      if (isLightOn) {
        // Lampu Menyala (Latar Terang & Kartu Muncul)
        body.className = "light-on bg-gradient-to-br from-indigo-100 via-slate-50 to-amber-50 min-h-screen flex items-center justify-center p-4 relative";
        card.classList.remove('opacity-0', 'scale-95', 'translate-y-8', 'pointer-events-none');
        card.classList.add('opacity-100', 'scale-100', 'translate-y-0');
        document.getElementById('pinInput').focus();
      } else {
        // Lampu Mati (Latar Gelap & Kartu Redup)
        body.className = "light-off bg-slate-950 min-h-screen flex items-center justify-center p-4 relative";
        card.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        card.classList.add('opacity-0', 'scale-95', 'translate-y-8', 'pointer-events-none');
      }
    }

    // LOGIKA LOGIN FORM
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('btnSubmit');

      // Animasi Memproses
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memeriksa PIN...`;
      lucide.createIcons();

      setTimeout(() => {
        if (pin === "123456") { // PIN Default
          sessionStorage.setItem("bk_admin_logged", "true");
          window.location.href = "admin-dashboard.html";
        } else {
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="key-round" class="w-4 h-4"></i> Masuk Dashboard`;
          lucide.createIcons();

          // Animasi Getar (Shake) Jika PIN Salah
          const card = document.getElementById('loginCard');
          card.classList.add('animate-bounce');
          setTimeout(() => card.classList.remove('animate-bounce'), 1000);
          
          alert("PIN Otentikasi Salah! Silakan coba lagi.");
        }
      }, 400);
    });

    // Otomatis nyalakan lampu saat pertama dibuka agar user langsung paham
    setTimeout(() => {
      toggleLight();
    }, 300);
  </script>
</body>
</html>
